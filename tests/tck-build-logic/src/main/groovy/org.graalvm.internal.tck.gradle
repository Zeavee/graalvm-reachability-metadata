// §AR-test-harness.3.1: run the forked JVM test workers on a JDK that need not be able to host
// Gradle. Selects an interpreter only — JVM arguments are left exactly as they would be otherwise.
String testJavaHome = System.getenv("GVM_TCK_TEST_JAVA_HOME")
// §AR-test-harness.3.1: opt-in escape hatch for a JDK that rejects Gradle's default `-ea`.
boolean disableTestAssertions = Boolean.parseBoolean(System.getenv("GVM_TCK_TEST_DISABLE_ASSERTIONS"))


// Ensure detailed exception/stacktrace logging for all Test tasks, including nativeTest
tasks.withType(Test).configureEach { Test testTask ->
    // §AR-test-harness.3: downstream pass/fail gates can run without coverage instrumentation.
    if (skipJacoco) {
        jacoco.enabled = false
    }
    // §AR-test-harness.8: when a jar has no line info, collect the agent's compressed origin
    // tree so the harness can match exact tracked APIs and reported caller methods on each path.
    if (testTask.name == 'test' && providers.gradleProperty('dynamicAccessOriginsOutput').isPresent()) {
        String originsOutput = providers.gradleProperty('dynamicAccessOriginsOutput').get()
        testTask.jvmArgs "-agentlib:native-image-agent=config-output-dir=${originsOutput},experimental-configuration-with-origins"
        testTask.jacoco.enabled = false
        testTask.outputs.upToDateWhen { false }
    }
    if (testJavaHome != null && !testJavaHome.trim().isEmpty()) {
        // Clear the toolchain-derived launcher first: Gradle rejects a Test task that carries both
        // a configured javaLauncher and an executable, and the Kotlin/Scala coordinates pin one.
        testTask.javaLauncher.unset()
        testTask.executable = new File(new File(testJavaHome, "bin"), "java").absolutePath
    }
    if (disableTestAssertions) {
        testTask.enableAssertions = false
    }
    systemProperty "junit.jupiter.execution.timeout.default", "${maxJUnitTestTimeoutSeconds} s"
    systemProperty "junit.jupiter.execution.timeout.mode", "enabled"
    systemProperty "junit.jupiter.execution.timeout.thread.mode.default", "separate_thread"
    testLogging {
        // Options: 'full' or 'short'; use full to include stack traces and causes
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

