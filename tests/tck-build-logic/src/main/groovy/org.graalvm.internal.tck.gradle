    dependencies {
        testImplementation "org.assertj:assertj-core:3.22.0"
    }
    // §real-use-tests/AR-real-use-test-harness.2
    tasks.register("generateRealUseFilter") { task ->
        task.setDescription("Writes user-code-filter.json covering every package of the declared libraries")
        task.setGroup(JavaBasePlugin.VERIFICATION_GROUP)
        task.doLast {
            List<File> jars = RealUseUtils.declaredLibraryJars(configurations.testImplementation, configurations.testRuntimeClasspath)
            jars.addAll(artifacts.resolveTestedLibraryJars())
            int rules = RealUseUtils.writeUserCodeFilter(file("user-code-filter.json"), jars)
            logger.lifecycle("Wrote user-code-filter.json with ${rules} package rules")
        }
    }

    // `-Pagent test` merges the session into one file; this copies it once the tests ran.
    // NBT's metadataCopy snapshots the agent output at configuration time, so in the same
    // build as the test run it would copy nothing.
    tasks.register("copyRealUseAgentMetadata") { task ->
        task.setDescription("Copies the native-image agent's merged test metadata to -Ptck.realUse.agentOutput")
        task.setGroup(JavaBasePlugin.VERIFICATION_GROUP)
        task.mustRunAfter("test")
        task.doLast {
            RealUseUtils.copyAgentMetadata(layout.buildDirectory.get().asFile, diagnostics.requiredAbsolutePathProperty("tck.realUse.agentOutput"))
        }
    }
}

